{% extends 'base.html' %}
{% load humanize %}

{% block title %}Tayyor bizneslar | BizBozor{% endblock %}

{% block content %}
<section class="page-section">
    <div class="container">
        <h1 class="page-title">{{ current_category.name_uz }}</h1>
        <p class="page-subtitle">
            {{ current_category.name_uz }} bo‘yicha tasdiqlangan e'lonlar ro‘yxati
        </p>

        
        <form method="get" class="listing-filter-bar" id="live-filter-form">
            <input
                type="text"
                name="q"
                value="{{ query }}"
                placeholder="Qidiruv..."
                class="filter-input"
            >

            <select name="region" class="filter-input">
                <option value="">Barcha hududlar</option>
                {% for region in regions %}
                    <option value="{{ region.id }}" {% if region_id == region.id|stringformat:"s" %}selected{% endif %}>
                        {{ region.name_uz }}
                    </option>
                {% endfor %}
            </select>

            <input
                type="number"
                name="min_price"
                value="{{ min_price }}"
                placeholder="Min narx"
                class="filter-input"
            >

            <input
                type="number"
                name="max_price"
                value="{{ max_price }}"
                placeholder="Max narx"
                class="filter-input"
            >

            <select name="sort" class="filter-input">
                <option value="">Eng yangi</option>
                <option value="oldest" {% if sort == 'oldest' %}selected{% endif %}>Eng eski</option>
                <option value="price_low" {% if sort == 'price_low' %}selected{% endif %}>Narx: arzon → qimmat</option>
                <option value="price_high" {% if sort == 'price_high' %}selected{% endif %}>Narx: qimmat → arzon</option>
            </select>

            <button type="submit" class="btn btn-primary">Qidirish</button>

            <button type="button" id="reset-filters" class="btn btn-outline">
                Tozalash
            </button>
        </form>

        <div id="listing-results">
            {% include 'listings/partials/listing_results.html' %}
        </div>
    </div>
</section>

<script>
document.addEventListener('DOMContentLoaded', function () {
    const form = document.getElementById('live-filter-form');
    const resultsContainer = document.getElementById('listing-results');
    const resultsCount = document.getElementById('results-count');

    if (!form || !resultsContainer) return;

    const inputs = form.querySelectorAll('input, select');
    let timeout = null;

    function updateListings() {
        const formData = new FormData(form);
        const params = new URLSearchParams(formData);

        fetch(window.location.pathname + '?' + params.toString(), {
            headers: {
                'X-Requested-With': 'XMLHttpRequest'
            }
        })
        .then(response => response.text())
        .then(html => {
            resultsContainer.innerHTML = html;

            const searchParams = new URLSearchParams(params);
            const newUrl = window.location.pathname + '?' + searchParams.toString();
            window.history.replaceState({}, '', newUrl);
        })
        .catch(error => {
            console.error('Live filter xatosi:', error);
        });
    }

    inputs.forEach(input => {
        const eventType = input.tagName.toLowerCase() === 'input' ? 'input' : 'change';

        input.addEventListener(eventType, function () {
            clearTimeout(timeout);
            timeout = setTimeout(updateListings, 400);
        });
    });

    const resetButton = document.getElementById('reset-filters');

    if (resetButton) {
        resetButton.addEventListener('click', function () {
            form.reset();
            updateListings();
        });
    }

    form.addEventListener('submit', function (e) {
        e.preventDefault();
        updateListings();
    });
});
</script>

{% endblock %}
